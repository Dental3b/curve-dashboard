name: Daily Summary

on:
  schedule:
    # Check throughout every local day, including early closes and weekend visits.
    # Offset from the top of the hour; GitHub may still delay scheduled runs.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      send:
        description: 'Send if the close is ready (unchecked = read-only preview)'
        type: boolean
        default: false
      report_date:
        description: 'Optional YYYY-MM-DD for a read-only preview'
        type: string
        default: ''

concurrency:
  group: dental3b-daily-summary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-summary:
    # Delivery was tested and confirmed; false remains an explicit pause switch.
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.send) ||
      (github.ref == 'refs/heads/main' && (vars.DAILY_SUMMARY_ENABLED || 'true') == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run daily summary
        shell: bash
        run: |
          args=()
          if [[ "$EVENT_NAME" == "schedule" || "$SEND_REQUESTED" == "true" ]]; then
            args+=(--send)
          fi
          if [[ -n "$REPORT_DATE" ]]; then
            args+=(--date "$REPORT_DATE")
          fi
          python daily_summary.py "${args[@]}"
        env:
          EVENT_NAME: ${{ github.event_name }}
          SEND_REQUESTED: ${{ inputs.send }}
          REPORT_DATE: ${{ inputs.report_date }}
          DAILY_SUMMARY_ENABLED: ${{ vars.DAILY_SUMMARY_ENABLED || 'true' }}
          CURVE_CLIENT_ID: ${{ secrets.CURVE_CLIENT_ID }}
          CURVE_CLIENT_SECRET: ${{ secrets.CURVE_CLIENT_SECRET }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ vars.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: 'es_MX'
          WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
