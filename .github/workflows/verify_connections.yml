name: Verify Curve and Meta connections

on:
  push:
    branches: [codex/restore-meta-daily-summary]
    paths: [.github/workflows/verify_connections.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify WhatsApp configuration and Meta access (read only)
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ vars.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from daily_summary import MetaSender
          names = (
              'WHATSAPP_PHONE_NUMBER_ID', 'WHATSAPP_TO',
              'WHATSAPP_TEMPLATE_NAME', 'WHATSAPP_TEMPLATE_LANGUAGE',
          )
          missing = [name for name in names if not os.environ.get(name, '').strip()]
          if missing:
              print('MISSING repository variables: ' + ', '.join(missing))
              print('Read-only verification: no WhatsApp message was sent.')
              sys.exit(1)
          try:
              sender = MetaSender.from_environment()
              if sender.template != 'dental3b_resumen_diario':
                  raise RuntimeError('WHATSAPP_TEMPLATE_NAME does not match the Dental 3B template')
              if not re.fullmatch(r'es(?:_[A-Z]{2})?', sender.language):
                  raise RuntimeError('WHATSAPP_TEMPLATE_LANGUAGE must match the approved Spanish variant')
              request = Request(
                  f'https://graph.facebook.com/{sender.version}/{sender.phone_id}?fields=id',
                  headers={'Authorization': f'Bearer {sender.token}'},
              )
              with urlopen(request, timeout=60) as response:
                  data = json.load(response)
              if str(data.get('id', '')) != sender.phone_id:
                  raise RuntimeError('Meta returned a different phone ID; stop configuration')
              print('PASS: required variables are present and valid; Meta accepted the token for the configured sender.')
              print('Configured template language: ' + sender.language)
              print('Recipient syntax is valid; ownership and template approval must be confirmed separately.')
              print('Read-only verification: no WhatsApp message was sent.')
          except HTTPError as error:
              try:
                  details = json.load(error).get('error', {})
              except Exception:
                  details = {}
              code = details.get('code')
              subcode = details.get('error_subcode')
              print(f'Meta HTTP {error.code}; code={code if isinstance(code, int) else "unknown"}; subcode={subcode if isinstance(subcode, int) else "unknown"}')
              sys.exit(1)
          except URLError as error:
              print(f'Meta transport error: {type(error.reason).__name__}')
              sys.exit(1)
          except Exception as error:
              print(str(error) if isinstance(error, RuntimeError) else type(error).__name__)
              sys.exit(1)
          PY
      - name: Verify Curve authentication and report retrieval (read only)
        if: ${{ !cancelled() }}
        env:
          CURVE_CLIENT_ID: ${{ secrets.CURVE_CLIENT_ID }}
          CURVE_CLIENT_SECRET: ${{ secrets.CURVE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import sys
          from datetime import date
          from daily_summary import get_summary
          try:
              summary = get_summary(date(2026, 10, 23))
              print('PASS: Curve authentication, ledger pagination and appointment retrieval succeeded.')
              print('No patient records or financial totals are printed in public workflow logs.')
          except Exception as error:
              print(str(error) if isinstance(error, RuntimeError) else type(error).__name__)
              sys.exit(1)
          PY

      - name: Inspect approved template language (read only)
        if: ${{ !cancelled() }}
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlencode
          from daily_summary import ApiError, request_json, required, whatsapp_token
          try:
              token = whatsapp_token()
              phone_id = required('WHATSAPP_PHONE_NUMBER_ID')
              template = required('WHATSAPP_TEMPLATE_NAME')
              version = os.environ.get('WHATSAPP_GRAPH_VERSION') or 'v23.0'
              if not phone_id.isdigit() or not re.fullmatch(r'v[0-9]+\.0', version):
                  raise RuntimeError('Invalid sender configuration')
              base = 'https://graph.facebook.com/' + version
              headers = {'Authorization': 'Bearer ' + token}
              debug = request_json('Meta token metadata', 'GET',
                  base + '/debug_token?' + urlencode({'input_token': token}), headers=headers).get('data', {})
              account_ids = set()
              for scope in debug.get('granular_scopes', []):
                  if scope.get('scope') in {'whatsapp_business_management', 'whatsapp_business_messaging'}:
                      account_ids.update(str(value) for value in scope.get('target_ids', []) if str(value).isdigit())
              if not account_ids:
                  raise RuntimeError('Meta token metadata does not expose an account ID; check language in WhatsApp Manager')
              matches = []
              for account_id in sorted(account_ids):
                  try:
                      phones = request_json('Meta account phone numbers', 'GET',
                          base + '/' + account_id + '/phone_numbers?fields=id&limit=100',
                          headers=headers).get('data', [])
                      if not any(str(phone.get('id')) == phone_id for phone in phones):
                          continue
                      templates = request_json('Meta template metadata', 'GET',
                          base + '/' + account_id + '/message_templates?' + urlencode({
                              'name': template, 'fields': 'name,status,language', 'limit': 100
                          }), headers=headers).get('data', [])
                      matches.extend(item for item in templates if item.get('name') == template)
                  except ApiError:
                      continue
              safe_matches = [(item.get('language'), item.get('status')) for item in matches
                  if re.fullmatch(r'es(?:_[A-Z]{2})?', str(item.get('language', '')))
                  and item.get('status') in {'APPROVED', 'PENDING', 'REJECTED', 'PAUSED', 'DISABLED'}]
              if not safe_matches:
                  raise RuntimeError('No accessible Spanish template metadata found; check language in WhatsApp Manager')
              for language, status in safe_matches:
                  print('TEMPLATE: language=' + language + '; status=' + status)
              print('Template inspection only; no WhatsApp message was sent.')
          except Exception as error:
              print(str(error) if isinstance(error, RuntimeError) else type(error).__name__)
              sys.exit(1)
          PY
