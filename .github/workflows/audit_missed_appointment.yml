name: Read-only treatment plan API capability check
on:
  push:
    branches: [codex/audit-missed-appointment-20261028]
    paths: [.github/workflows/audit_missed_appointment.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - name: Check treatment plan response schema without patient values
        env:
          CURVE_CLIENT_ID: ${{ secrets.CURVE_CLIENT_ID }}
          CURVE_CLIENT_SECRET: ${{ secrets.CURVE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import requests, json
          from curve_api import CurveAPI
          def shape(value, depth=0):
              if depth > 6: return type(value).__name__
              if isinstance(value,dict): return {k:shape(v,depth+1) for k,v in value.items()}
              if isinstance(value,list): return [shape(value[0],depth+1)] if value else []
              return type(value).__name__
          try:
              api=CurveAPI()
              response=requests.get(f"https://{api.instance}.curvehero.com/api/v2/treatment_plan",headers=api._headers(),timeout=60)
              print("TREATMENT_PLAN_HTTP_STATUS",response.status_code)
              if response.status_code==200:
                  data=response.json()
                  print("TREATMENT_PLAN_SCHEMA",json.dumps(shape(data)))
              # Only field names and types are printed, never patient values or credentials.
          except Exception as error:
              print("DIAGNOSTIC_ERROR_TYPE",type(error).__name__)
          
          PY
