name: Authorized test contact note
on:
  push:
    branches: [codex/audit-missed-appointment-20261028]
    paths: [.github/workflows/audit_missed_appointment.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - name: Create and verify authorized test note
        env:
          CURVE_CLIENT_ID: ${{ secrets.CURVE_CLIENT_ID }}
          CURVE_CLIENT_SECRET: ${{ secrets.CURVE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, sys, requests
          from curve_api import CurveAPI
          clinics=CurveAPI().get_clinics()
          if len(clinics)!=1:
              print("CLINIC_AMBIGUOUS_NO_WRITE")
              sys.exit(1)
          r=requests.post("https://sso.curvehero.com/connect/token",data={"grant_type":"client_credentials","client_id":os.environ["CURVE_CLIENT_ID"],"client_secret":os.environ["CURVE_CLIENT_SECRET"],"scope":"notes.contact:write"},timeout=30)
          print("TOKEN_STATUS",r.status_code)
          if not r.ok: sys.exit(1)
          response=requests.post("https://dentalthreeb.curvehero.com/api/v2/contact/163/note",headers={"Authorization":"Bearer "+r.json()["access_token"]},json={"clinicId":str(clinics[0]["id"]),"description":"<p>www.prueba nota.com</p>","tags":["Correspondence"]},timeout=45)
          print("CREATE_STATUS",response.status_code)
          if response.status_code==200:
              data=response.json()
              print("NOTE_ID",data.get("id"))
              print("CONTENT_CONFIRMED",data.get("description")=="<p>www.prueba nota.com</p>")
              print("CONTACT_CONFIRMED",str(data.get("contact",{}).get("id"))=="163")
          else:
              print("NOTE_CREATION_NOT_CONFIRMED")
              sys.exit(1)
          
          PY
