name: Authorized test contact note
on:
  push:
    branches: [codex/audit-missed-appointment-20261028]
    paths: [.github/workflows/audit_missed_appointment.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - name: Create and verify authorized test note
        env:
          CURVE_CLIENT_ID: ${{ secrets.CURVE_CLIENT_ID }}
          CURVE_CLIENT_SECRET: ${{ secrets.CURVE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, sys, requests
          from urllib.parse import urljoin, urlsplit
          base="https://dentalthreeb.curvehero.com"
          def stop(label, code=None):
              print(label, code if code is not None else "")
              sys.exit(1)
          r=requests.post("https://sso.curvehero.com/connect/token",data={"grant_type":"client_credentials","client_id":os.environ["CURVE_CLIENT_ID"],"client_secret":os.environ["CURVE_CLIENT_SECRET"],"scope":"notes.contact:read notes.contact:write clinic:read patient:read"},timeout=30)
          print("TOKEN_STATUS",r.status_code)
          if not r.ok: stop("TOKEN_SCOPE_REQUEST_FAILED")
          headers={"Authorization":"Bearer "+r.json()["access_token"]}
          def get(path):
              url=urljoin(base,path)
              if urlsplit(url).netloc!=urlsplit(base).netloc: stop("UNEXPECTED_HOST")
              response=requests.get(url,headers=headers,timeout=45)
              if not response.ok: stop("READ_FAILED",response.status_code)
              return response.json()
          notes=get("/api/v2/contact/163/note")
          rows=notes.get("objects",[])
          refs=[n.get("contact",{}).get("href") for n in rows if str(n.get("contact",{}).get("id"))=="163"]
          if not refs: stop("CONTACT_IDENTITY_LINK_UNAVAILABLE_NO_WRITE")
          contact=get(refs[0])
          first=str(contact.get("firstName",contact.get("firstname",""))).strip().lower()
          last=str(contact.get("lastName",contact.get("lastname",""))).strip().lower()
          if first+" "+last!="test new": stop("CONTACT_NAME_NOT_VERIFIED_NO_WRITE")
          print("CONTACT_TEST_IDENTITY_VERIFIED")
          from curve_api import CurveAPI
          clinics=CurveAPI().get_clinics()
          if len(clinics)!=1: stop("CLINIC_NOT_UNAMBIGUOUS_NO_WRITE")
          clinic_id=str(clinics[0]["id"])
          description="<p>Prueba de integración API — Test New. No contiene información clínica.</p>"
          if any(n.get("description")==description for n in rows):
              print("TEST_NOTE_ALREADY_PRESENT")
              sys.exit(0)
          response=requests.post(base+"/api/v2/contact/163/note",headers=headers,json={"clinicId":clinic_id,"description":description,"tags":["Correspondence"]},timeout=45)
          print("CREATE_STATUS",response.status_code)
          if not response.ok: stop("CREATE_FAILED")
          created=response.json()
          nid=str(created.get("id",""))
          print("CREATED_NOTE_ID",nid)
          verify=get("/api/v2/contact/163/note?order=RecentFirst")
          matched=any(str(n.get("id"))==nid and n.get("description")==description for n in verify.get("objects",[]))
          print("NOTE_READBACK_VERIFIED",matched)
          if not matched: sys.exit(1)
          
          PY
